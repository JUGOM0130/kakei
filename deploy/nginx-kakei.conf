# /etc/nginx/sites-available/kakei に配置し sites-enabled へシンボリックリンク。
# server_name は実ドメインに置換すること。certbot --nginx 実行後に 443 設定が追記される。
server {
    listen 80;
    server_name kakei.example.jp;

    root /opt/kakei/frontend/dist;
    index index.html;

    # Django API
    location /api/ {
        proxy_pass http://unix:/run/kakei/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django 管理画面
    location /admin/ {
        proxy_pass http://unix:/run/kakei/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # collectstatic した admin 用静的ファイル
    location /static/ {
        alias /opt/kakei/backend/staticfiles/;
    }

    # Vite のハッシュ付きアセットは長期キャッシュ
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history モードのフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }
}
