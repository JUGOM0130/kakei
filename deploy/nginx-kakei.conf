# AlmaLinux: /etc/nginx/conf.d/kakei.conf に配置 (sites-available 方式は無い)。
# アプリはサブパス /kakei/ で公開する (VPS 標準ドメインを利用、他アプリと同居可能)。
# gunicorn 側は systemd の SCRIPT_NAME=/kakei がプレフィックスを処理する。
# 8001 はこの VPS の既存アプリが使用中のため 8011 を使う。
# SELinux 有効環境では以下が必要:
#   setsebool -P httpd_can_network_connect 1
#   semanage fcontext -a -t httpd_sys_content_t "/opt/kakei/frontend/dist(/.*)?"
#   semanage fcontext -a -t httpd_sys_content_t "/opt/kakei/backend/staticfiles(/.*)?"
#   restorecon -R /opt/kakei
server {
    listen 80;
    server_name v133-18-242-137.vir.kagoya.net;

    # 明細 PDF のアップロード (OCR取込) を許可
    client_max_body_size 15m;

    # ルートアクセスはアプリへ (他のアプリをルートに置く場合はこの行を削除)
    location = / {
        return 302 /kakei/;
    }

    # 末尾スラッシュ無しの /kakei も受ける (無いと nginx 404 になる)
    location = /kakei {
        return 302 /kakei/;
    }

    # Django API (プレフィックスごと渡す。SCRIPT_NAME が処理する)
    location /kakei/api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # OCR は時間がかかることがある
        proxy_read_timeout 180s;
    }

    # Django 管理画面
    location /kakei/admin/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # collectstatic した admin 用静的ファイル (STATIC_URL は SCRIPT_NAME 前置で /kakei/static/)
    location /kakei/static/ {
        alias /opt/kakei/backend/staticfiles/;
    }

    # Vite のハッシュ付きアセットは長期キャッシュ
    location /kakei/assets/ {
        alias /opt/kakei/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 本体 + history モードのフォールバック。
    # index.html はキャッシュさせない (デプロイ後に古い index が残ると
    # ハッシュ付きアセットが 404 になり画面が壊れるため)
    location /kakei/ {
        alias /opt/kakei/frontend/dist/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /kakei/index.html;
    }
}
