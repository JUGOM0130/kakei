# ローカル開発専用。本番 (カゴヤVPS) は systemd + Gunicorn + Nginx 直配置で Docker は使わない。
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - dbdata:/data
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SQLITE_PATH: /data/db.sqlite3
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      # ホスト側は 5174 (5173 は別プロジェクトが使用中)。http://localhost:5174 を開く
      - "5174:5173"
    depends_on:
      - backend

volumes:
  dbdata:
  node_modules:
